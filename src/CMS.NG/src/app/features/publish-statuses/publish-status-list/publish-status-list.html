<div class="page-toolbar">
  <h1 class="page-title">發布狀態 PublishStatus</h1>
  <span class="page-subtitle">內容發布狀態</span>
  <span class="spacer"></span>
  <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="drawerVisible.set(true)" />
  <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
</div>

<div class="card">
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="pkid"
    styleClass="p-datatable-striped p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 8rem">草稿 <p-sortIcon field="isDraft" /></th>
        <th pSortableColumn="isPublished" style="width: 8rem">已發布 <p-sortIcon field="isPublished" /></th>
        <th pSortableColumn="isDiscontinued" style="width: 8rem">
          已停用 <p-sortIcon field="isDiscontinued" />
        </th>
        <th style="width: 10rem; text-align: center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-status>
      <tr>
        <td>{{ status.pkid }}</td>
        <td>{{ status.description }}</td>
        <td><p-tag [value]="status.isDraft ? '是' : '否'" [severity]="status.isDraft ? 'info' : 'secondary'" /></td>
        <td><p-tag [value]="status.isPublished ? '是' : '否'" [severity]="status.isPublished ? 'success' : 'secondary'" /></td>
        <td><p-tag [value]="status.isDiscontinued ? '是' : '否'" [severity]="status.isDiscontinued ? 'danger' : 'secondary'" /></td>
        <td style="text-align: center">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(status)"
          />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(status)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="remove(status, $event)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" style="text-align: center" class="text-muted">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label for="kw">關鍵字</label>
    <input
      id="kw"
      type="text"
      pInputText
      class="full-width"
      placeholder="狀態說明"
      [(ngModel)]="filters.keyword"
    />
  </div>

  <div class="field">
    <label for="isDraft">草稿</label>
    <p-select
      inputId="isDraft"
      styleClass="full-width"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="filters.isDraft"
    />
  </div>

  <div class="field">
    <label for="isPublished">已發布</label>
    <p-select
      inputId="isPublished"
      styleClass="full-width"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="filters.isPublished"
    />
  </div>

  <div class="field">
    <label for="isDiscontinued">已停用</label>
    <p-select
      inputId="isDiscontinued"
      styleClass="full-width"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="filters.isDiscontinued"
    />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="套用" icon="pi pi-check" (onClick)="applyFilters()" />
  </div>
</p-drawer>
