<div class="page-toolbar">
  <h1 class="page-title">使用者 AppUser</h1>
  <span class="page-subtitle">系統登入帳號</span>
  <span class="spacer"></span>
  <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="drawerVisible.set(true)" />
  <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
</div>

<div class="card">
  <p-table
    [value]="users()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="userId"
    styleClass="p-datatable-striped p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="userId">使用者代碼 <p-sortIcon field="userId" /></th>
        <th pSortableColumn="userName">使用者名稱 <p-sortIcon field="userName" /></th>
        <th pSortableColumn="isActive" style="width: 8rem">啟用 <p-sortIcon field="isActive" /></th>
        <th pSortableColumn="roleCount" style="width: 8rem">角色數 <p-sortIcon field="roleCount" /></th>
        <th style="width: 10rem; text-align: center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.pkid }}</td>
        <td>{{ user.userId }}</td>
        <td>{{ user.userName }}</td>
        <td>
          <p-tag
            [value]="user.isActive ? '啟用' : '停用'"
            [severity]="user.isActive ? 'success' : 'secondary'"
          />
        </td>
        <td>{{ user.roleCount }}</td>
        <td style="text-align: center">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(user)"
          />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(user)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="remove(user, $event)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" style="text-align: center" class="text-muted">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label for="kw">關鍵字</label>
    <input
      id="kw"
      type="text"
      pInputText
      class="full-width"
      placeholder="使用者代碼／名稱"
      [(ngModel)]="filters.keyword"
    />
  </div>

  <div class="field">
    <label for="isActive">啟用</label>
    <p-select
      inputId="isActive"
      styleClass="full-width"
      [options]="activeOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="filters.isActive"
    />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="套用" icon="pi pi-check" (onClick)="applyFilters()" />
  </div>
</p-drawer>
