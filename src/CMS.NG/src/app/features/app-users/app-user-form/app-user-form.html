<div class="page-toolbar">
  <h1 class="page-title">{{ isEdit() ? '編輯使用者' : '新增使用者' }}</h1>
  <app-row-audit-badge tableName="AppUser" [pkid]="auditPkid()" />
  <span class="spacer"></span>
  <p-button label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
  @if (isEdit() && isAdmin()) {
    <p-button
      label="重設密碼"
      icon="pi pi-key"
      severity="warn"
      (onClick)="resetPassword($event)"
      [loading]="resetting()"
    />
  }
  <p-button label="儲存" icon="pi pi-check" severity="success" (onClick)="save()" [loading]="saving()" />
</div>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="card">
    <h2 class="card-title">使用者資料</h2>

    <div class="field">
      <label for="userId">使用者代碼 <span class="required">*</span></label>
      <input
        id="userId"
        type="text"
        pInputText
        class="full-width"
        placeholder="請輸入使用者代碼"
        formControlName="userId"
      />
      @if (invalid('userId')) {
        <div class="field-error">使用者代碼為必填。</div>
      }
    </div>

    <div class="field">
      <label for="userName">使用者名稱 <span class="required">*</span></label>
      <input id="userName" type="text" pInputText class="full-width" formControlName="userName" />
      @if (invalid('userName')) {
        <div class="field-error">使用者名稱為必填。</div>
      }
    </div>

    <div class="field-check">
      <p-checkbox inputId="isActive" formControlName="isActive" [binary]="true" />
      <label for="isActive">啟用</label>
    </div>

    @if (!isEdit()) {
      <p class="hint text-muted">
        <i class="pi pi-info-circle"></i>
        新使用者的密碼將自動設為系統預設值，可於檢視頁重設。
      </p>
    }
  </div>

  <div class="card">
    <h2 class="card-title">角色</h2>
    <p-multiSelect
      [options]="roleOptions()"
      formControlName="roleIds"
      optionLabel="label"
      optionValue="value"
      placeholder="選擇角色（可複選）"
      display="chip"
      appendTo="body"
      [filter]="true"
      [maxSelectedLabels]="9999"
      styleClass="full-width"
    />
  </div>
</form>
