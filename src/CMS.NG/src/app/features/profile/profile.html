<div class="page-toolbar">
  <h1 class="page-title">個人資料 My Profile</h1>
  <span class="spacer"></span>
  <p-button label="儲存" icon="pi pi-check" severity="success" (onClick)="save()" [loading]="saving()" />
</div>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="card">
    <h2 class="card-title">帳號資訊</h2>

    <div class="detail-row">
      <div class="detail-label">使用者代碼 UserId</div>
      <div class="detail-value">{{ userId() ?? '—' }}</div>
    </div>

    <div class="field">
      <label for="userName">使用者名稱 UserName<span class="required">*</span></label>
      <input
        id="userName"
        type="text"
        pInputText
        class="full-width"
        formControlName="userName"
        autocomplete="name"
      />
      @if (invalid()) {
        <div class="field-error">請輸入使用者名稱。</div>
      }
    </div>

    <div class="detail-row">
      <div class="detail-label">角色 Roles</div>
      <div class="detail-value">
        @if (roles().length) {
          <div class="chip-list">
            @for (role of roles(); track role) {
              <span class="chip">{{ role }}</span>
            }
          </div>
        } @else {
          <span class="text-muted">尚未指派角色</span>
        }
      </div>
    </div>
  </div>
</form>
