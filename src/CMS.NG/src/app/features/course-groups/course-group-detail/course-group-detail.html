<div class="page-toolbar">
  <h1 class="page-title">檢視課程分類</h1>
  <span class="spacer"></span>
  <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
  <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" [disabled]="!group()" />
</div>

@if (group(); as g) {
  <div class="card">
    <h2 class="card-title">課程分類資料</h2>

    <div class="detail-row">
      <div class="detail-label">主代碼</div>
      <div class="detail-value">{{ g.pkid }}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">分類說明</div>
      <div class="detail-value">{{ g.description }}</div>
    </div>
  </div>
} @else if (!loading()) {
  <div class="card text-muted">找不到課程分類資料。</div>
}
