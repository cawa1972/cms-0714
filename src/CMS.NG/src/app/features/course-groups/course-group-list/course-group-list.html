<div class="page-toolbar">
  <h1 class="page-title">課程分類 CourseGroup</h1>
  <span class="page-subtitle">課程所屬的分類</span>
  <span class="spacer"></span>
  <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="drawerVisible.set(true)" />
  <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
</div>

<div class="card">
  <p-table
    [value]="groups()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    dataKey="pkid"
    styleClass="p-datatable-striped p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">分類說明 <p-sortIcon field="description" /></th>
        <th style="width: 10rem; text-align: center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-group>
      <tr>
        <td>{{ group.pkid }}</td>
        <td>{{ group.description }}</td>
        <td style="text-align: center">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(group)"
          />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(group)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="remove(group, $event)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" style="text-align: center" class="text-muted">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label for="kw">關鍵字</label>
    <input
      id="kw"
      type="text"
      pInputText
      class="full-width"
      placeholder="分類說明"
      [(ngModel)]="filters.keyword"
    />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="套用" icon="pi pi-check" (onClick)="applyFilters()" />
  </div>
</p-drawer>
